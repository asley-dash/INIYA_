<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Math Path Academy - Cat Addition</title>

  <!-- Google Fonts: Fredoka Rounded -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Confetti for instant celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      font-family: 'Fredoka', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: #FFF9F2;
      min-height: 100vh;
    }

    .key-btn {
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 0 #F59E0B;
    }
    .key-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #F59E0B;
    }

    .action-btn {
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .action-btn:active {
      transform: translateY(3px);
    }

    /* Active selected box focus glow */
    .ans-box {
      caret-color: transparent;
      transition: all 0.15s ease;
    }
    .ans-box.active-col {
      border-color: #F59E0B !important;
      background-color: #FEF3C7 !important;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.35);
      transform: scale(1.05);
    }

    /* Cat gentle animations */
    .bounce-happy {
      animation: catCelebrate 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes catCelebrate {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.22) translateY(-8px); }
    }

    .shake-error {
      animation: wiggle 0.35s ease-in-out;
    }
    @keyframes wiggle {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-3 sm:p-5 max-w-md mx-auto">

  <!-- Minimal Header -->
  <header class="w-full flex items-center justify-between pt-1 pb-2">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-2xl bg-amber-400 flex items-center justify-center text-lg shadow-sm">
        🐾
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-amber-950 tracking-tight leading-none">Math Path Academy</h1>
        <p class="text-[11px] font-bold text-amber-600">Cat Addition</p>
      </div>
    </div>

    <!-- Fish Score -->
    <div class="flex items-center gap-1.5 bg-amber-100/80 border-2 border-amber-300/80 px-3 py-1 rounded-2xl">
      <span class="text-xl">🐟</span>
      <span id="fish-count" class="font-extrabold text-amber-950 text-xl leading-none">0</span>
    </div>
  </header>

  <!-- Cat Companion with Bubble -->
  <div class="flex items-center justify-center gap-3 my-2">
    <div id="cat-avatar" class="text-5xl select-none transition-transform cursor-pointer" onclick="meowSound()">
      🐱
    </div>
    <div id="cat-bubble" class="bg-white border-2 border-amber-200 px-4 py-2 rounded-2xl shadow-sm font-bold text-slate-700 text-sm">
      Let's add! Start with Ones 👉
    </div>
  </div>

  <!-- The Column Addition Board -->
  <main class="w-full bg-white rounded-3xl p-4 sm:p-5 shadow-lg border-3 border-amber-100 flex flex-col items-center my-1" id="board">
    
    <!-- Column Place Value Labels -->
    <div class="grid grid-cols-4 gap-2 w-full max-w-[280px] text-center mb-1">
      <div></div>
      <div class="font-black text-xs sm:text-sm text-sky-600 bg-sky-50 py-1 rounded-xl">H</div>
      <div class="font-black text-xs sm:text-sm text-emerald-600 bg-emerald-50 py-1 rounded-xl">T</div>
      <div class="font-black text-xs sm:text-sm text-rose-600 bg-rose-50 py-1 rounded-xl">O</div>
    </div>

    <!-- Top Number -->
    <div class="grid grid-cols-4 gap-2 w-full max-w-[280px] text-center items-center my-1">
      <div></div>
      <div id="n1-h" class="text-3xl sm:text-4xl font-black text-slate-700"></div>
      <div id="n1-t" class="text-3xl sm:text-4xl font-black text-slate-700">4</div>
      <div id="n1-o" class="text-3xl sm:text-4xl font-black text-slate-700">7</div>
    </div>

    <!-- Bottom Number -->
    <div class="grid grid-cols-4 gap-2 w-full max-w-[280px] text-center items-center my-1">
      <div class="text-3xl font-black text-amber-500 text-center">+</div>
      <div id="n2-h" class="text-3xl sm:text-4xl font-black text-slate-700"></div>
      <div id="n2-t" class="text-3xl sm:text-4xl font-black text-slate-700">3</div>
      <div id="n2-o" class="text-3xl sm:text-4xl font-black text-slate-700">5</div>
    </div>

    <!-- Solid Divider -->
    <div class="w-full max-w-[280px] h-1.5 bg-slate-800 rounded-full my-2"></div>

    <!-- Answer Boxes (Child inputs into these) -->
    <div class="grid grid-cols-4 gap-2 w-full max-w-[280px] text-center items-center">
      <div class="text-2xl font-bold text-amber-400">=</div>

      <!-- Hundreds answer box -->
      <button onclick="setFocusCol('h')" id="box-h" class="ans-box h-14 sm:h-16 rounded-2xl border-3 border-slate-200 bg-slate-50 font-black text-2xl sm:text-3xl text-slate-800 flex items-center justify-center">
      </button>

      <!-- Tens answer box -->
      <button onclick="setFocusCol('t')" id="box-t" class="ans-box h-14 sm:h-16 rounded-2xl border-3 border-slate-200 bg-slate-50 font-black text-2xl sm:text-3xl text-slate-800 flex items-center justify-center">
      </button>

      <!-- Ones answer box -->
      <button onclick="setFocusCol('o')" id="box-o" class="ans-box active-col h-14 sm:h-16 rounded-2xl border-3 border-slate-200 bg-slate-50 font-black text-2xl sm:text-3xl text-slate-800 flex items-center justify-center">
      </button>
    </div>

    <!-- Bottom Divider -->
    <div class="w-full max-w-[280px] h-1.5 bg-slate-800 rounded-full my-2"></div>
  </main>

  <!-- Chunky Child-Friendly Keypad -->
  <section class="w-full bg-amber-50 rounded-3xl p-3 border-2 border-amber-200 flex flex-col gap-2 mt-2">
    <!-- Row 1 -->
    <div class="grid grid-cols-5 gap-1.5">
      <button onclick="tapKey('1')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">1</button>
      <button onclick="tapKey('2')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">2</button>
      <button onclick="tapKey('3')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">3</button>
      <button onclick="tapKey('4')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">4</button>
      <button onclick="tapKey('5')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">5</button>
    </div>

    <!-- Row 2 -->
    <div class="grid grid-cols-5 gap-1.5">
      <button onclick="tapKey('6')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">6</button>
      <button onclick="tapKey('7')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">7</button>
      <button onclick="tapKey('8')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">8</button>
      <button onclick="tapKey('9')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">9</button>
      <button onclick="tapKey('0')" class="key-btn h-12 rounded-2xl bg-white border-2 border-amber-300 font-extrabold text-2xl text-slate-800">0</button>
    </div>

    <!-- Controls Row: Erase & Check -->
    <div class="grid grid-cols-4 gap-2 pt-1">
      <button onclick="eraseKey()" class="action-btn h-13 col-span-1 rounded-2xl bg-rose-100 border-2 border-rose-300 text-rose-700 font-black text-xl flex items-center justify-center shadow-xs">
        ⌫
      </button>
      <button onclick="checkResult()" class="action-btn h-13 col-span-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-xl flex items-center justify-center gap-2 shadow-[0_4px_0_#059669]">
        <span>Check 🐾</span>
      </button>
    </div>
  </section>

  <script>
    // Audio synthesizer
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function soundTap() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(500, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.04);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch(e) {}
    }

    function meowSound() {
      try {
        const ctx = getAudio();
        // Friendly bright chime
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
          g.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.25);
          o.connect(g);
          g.connect(ctx.destination);
          o.start(ctx.currentTime + idx * 0.08);
          o.stop(ctx.currentTime + idx * 0.08 + 0.25);
        });
      } catch(e) {}
    }

    function soundTryAgain() {
      try {
        const ctx = getAudio();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(260, ctx.currentTime);
        o.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.15);
        g.gain.setValueAtTime(0.15, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    // App state
    let num1 = 0;
    let num2 = 0;
    let fish = 0;
    let activeCol = 'o'; // 'o' | 't' | 'h'
    let isLocked = false;

    const catAvatars = ['🐱', '😸', '😺', '😻', '🐾'];

    function setBubble(text) {
      document.getElementById('cat-bubble').textContent = text;
    }

    function setFocusCol(col) {
      soundTap();
      activeCol = col;
      ['h', 't', 'o'].forEach(c => {
        const el = document.getElementById(`box-${c}`);
        if (c === col) {
          el.classList.add('active-col');
        } else {
          el.classList.remove('active-col');
        }
      });
    }

    function generateSum() {
      isLocked = false;
      // 70% 3-digit + 2-digit, 30% 2-digit + 2-digit (Year 3 curriculum standard)
      const isThreeDigit = Math.random() > 0.3;

      if (isThreeDigit) {
        num1 = Math.floor(Math.random() * 650) + 120; // 120 to 769
        num2 = Math.floor(Math.random() * 75) + 14;   // 14 to 88
      } else {
        num1 = Math.floor(Math.random() * 65) + 15;  // 15 to 79
        num2 = Math.floor(Math.random() * 65) + 12;  // 12 to 76
      }

      // Populate column numbers
      const s1 = String(num1);
      const s2 = String(num2);

      document.getElementById('n1-h').textContent = s1.length >= 3 ? s1[s1.length - 3] : '';
      document.getElementById('n1-t').textContent = s1.length >= 2 ? s1[s1.length - 2] : '';
      document.getElementById('n1-o').textContent = s1[s1.length - 1];

      document.getElementById('n2-h').textContent = s2.length >= 3 ? s2[s2.length - 3] : '';
      document.getElementById('n2-t').textContent = s2.length >= 2 ? s2[s2.length - 2] : '';
      document.getElementById('n2-o').textContent = s2[s2.length - 1];

      // Clear input boxes
      document.getElementById('box-h').textContent = '';
      document.getElementById('box-t').textContent = '';
      document.getElementById('box-o').textContent = '';

      // Reset focus to Ones column
      setFocusCol('o');
      setBubble('Start with the Ones! 🐾');

      // Random friendly cat expression
      document.getElementById('cat-avatar').textContent = catAvatars[Math.floor(Math.random() * catAvatars.length)];
    }

    function tapKey(digit) {
      if (isLocked) return;
      soundTap();

      const curBox = document.getElementById(`box-${activeCol}`);
      curBox.textContent = digit;

      // Smart progression: automatically jump Ones -> Tens -> Hundreds
      if (activeCol === 'o') {
        setFocusCol('t');
        setBubble('Now add the Tens! 🐾');
      } else if (activeCol === 't') {
        const total = num1 + num2;
        if (total >= 100) {
          setFocusCol('h');
          setBubble('Now the Hundreds! 🐾');
        }
      }
    }

    function eraseKey() {
      if (isLocked) return;
      soundTap();
      const curBox = document.getElementById(`box-${activeCol}`);
      curBox.textContent = '';
    }

    function checkResult() {
      if (isLocked) return;

      const oVal = document.getElementById('box-o').textContent.trim();
      const tVal = document.getElementById('box-t').textContent.trim();
      const hVal = document.getElementById('box-h').textContent.trim();

      if (oVal === '') {
        soundTryAgain();
        setBubble('Fill in your answer first! 🐾');
        setFocusCol('o');
        return;
      }

      const childTotal = parseInt((hVal || '') + (tVal || '0') + oVal, 10);
      const target = num1 + num2;

      const cat = document.getElementById('cat-avatar');
      const board = document.getElementById('board');

      if (childTotal === target) {
        // Success
        isLocked = true;
        meowSound();
        fish += 1;
        document.getElementById('fish-count').textContent = fish;

        cat.textContent = '😻';
        cat.classList.add('bounce-happy');
        setTimeout(() => cat.classList.remove('bounce-happy'), 600);

        setBubble(`Purr-fect! You got it! 🐟`);

        if (typeof confetti === 'function') {
          confetti({
            particleCount: 35,
            spread: 50,
            origin: { y: 0.6 }
          });
        }

        setTimeout(() => {
          generateSum();
        }, 1500);

      } else {
        // Error
        soundTryAgain();
        board.classList.add('shake-error');
        setTimeout(() => board.classList.remove('shake-error'), 400);

        cat.textContent = '😿';
        setBubble('Try again! You can do it! 🐾');
      }
    }

    window.addEventListener('load', () => {
      generateSum();
    });
  </script>
</body>
</html>
